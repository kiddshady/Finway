<!DOCTYPE html>
<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Finway no habla con nadie
     — los datos son un JSON local y no hay una sola llamada de red. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Finway</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/terminal.css">
<link rel="stylesheet" href="./css/finway.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #070605;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 48px; height: 48px; filter: drop-shadow(0 0 10px rgb(248 172 61 / .35)); }
  /* La F se ARMA, no aparece: el stem primero y los brazos en cascada hacia
     abajo — el caudal bajando, que es de lo que habla la app. */
  #boot-splash .fm-stem,
  #boot-splash .fm-arm { transform-origin: 4px 0; animation: boot-grow .5s cubic-bezier(.16,1,.3,1) both; }
  #boot-splash .fm-stem { transform-origin: 0 0; animation-name: boot-rise; }
  #boot-splash .fm-a1 { animation-delay: .16s; }
  #boot-splash .fm-a2 { animation-delay: .27s; }
  #boot-splash .fm-a3 { animation-delay: .38s; }
  @keyframes boot-grow { from { transform: scaleX(0); opacity: 0 } to { transform: scaleX(1); opacity: 1 } }
  @keyframes boot-rise { from { transform: scaleY(0); opacity: 0 } to { transform: scaleY(1); opacity: 1 } }
</style>

<div id="boot-splash">
  <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
    <!-- La F de píxel de fin/mark.js en su grilla de 16, a 48 px (3 px por
         celda). Los tonos van literales, no en var(): esto pinta ANTES de que
         cargue tokens.css. Se regenera con `node tools/icono.mjs --splash` y
         se pega acá: si diverge de mark.js, el arranque pega un salto cuando
         el splash le pasa la posta a la titlebar. -->
    <path class="fm-stem" fill="#f8ac3d" d="M0 0h3v1h-3zM0 1h3v1h-3zM0 2h3v1h-3zM0 3h3v1h-3z"/>
    <path class="fm-stem" fill="#b97f2b" d="M0 4h3v1h-3zM0 5h3v1h-3zM0 6h3v1h-3zM0 7h3v1h-3z"/>
    <path class="fm-stem" fill="#805307" d="M0 8h3v1h-3zM0 9h3v1h-3zM0 10h3v1h-3zM0 11h3v1h-3z"/>
    <path class="fm-stem" fill="#5c3a02" d="M0 12h3v1h-3zM0 13h3v1h-3zM0 14h3v1h-3zM0 15h3v1h-3z"/>
    <path class="fm-arm fm-a1" fill="#f8ac3d" d="M4 0h12v1h-12zM4 1h12v1h-12zM4 2h12v1h-12z"/>
    <path class="fm-arm fm-a2" fill="#b97f2b" d="M4 4h8v1h-8zM4 5h8v1h-8zM4 6h8v1h-8z"/>
    <path class="fm-arm fm-a3" fill="#805307" d="M4 8h10v1h-10zM4 9h10v1h-10zM4 10h10v1h-10z"/>
  </svg>
</div>

<div class="ox-app">

  <!-- ── Titlebar: la marca, dónde estoy y la hora ─────────────────────────── -->
  <header class="ox-titlebar">
    <div class="fw-brand ox-no-drag" id="brand">
      <span class="fw-brand__mark" id="brand-mark"></span>
      <span class="fw-brand__name">FINWAY</span>
    </div>
    <div class="fw-crumb" id="crumb">
      <i data-icon="chevronRight"></i>
      <span id="crumb-view">RESUMEN</span>
      <span class="fw-crumb__sep2"><i data-icon="chevronRight"></i></span>
      <span class="fw-crumb__mes" id="crumb-mes"></span>
    </div>
    <span class="fw-clock" id="clock"></span>
    <div class="ox-wincontrols">
      <button class="ox-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
      <button class="ox-wincontrol" id="win-max"   aria-label="Maximizar"><i data-icon="winMax"></i></button>
      <button class="ox-wincontrol ox-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
    </div>
  </header>

  <!-- ── La cinta: las cifras del mes, pasando ─────────────────────────────── -->
  <div class="fw-tape" id="tape-box"><div class="fw-tape__track" id="tape"></div></div>

  <!-- ── El escenario: acá monta el router cada pantalla ───────────────────── -->
  <div class="ox-body">
    <main class="ox-main" id="view"></main>
  </div>

  <!-- ── La línea de carga: `gasto 4500 transporte uber` y Enter ───────────── -->
  <div class="fw-cmd">
    <span class="fw-cmd__p"><i data-icon="prompt"></i>CARGA</span>
    <input class="fw-cmd__in" id="cmd" spellcheck="false" autocomplete="off"
           placeholder="gasto 4500 transporte uber" aria-label="Línea de carga">
    <div class="fw-parse" id="parse"></div>
    <span class="fw-cmd__hint">
      <span class="fw-key">ENTER</span> REGISTRA
      <span class="fw-key">/</span> ENFOCA
      <span class="fw-key">CTRL N</span> FORMULARIO
    </span>
  </div>

  <!-- ── Teclas de función y estado ────────────────────────────────────────── -->
  <nav class="fw-fk" id="fk">
    <button class="fw-fk__b" data-view="resumen"><span class="fw-key">F1</span>RESUMEN</button>
    <button class="fw-fk__b" data-view="movimientos"><span class="fw-key">F2</span>MOVIMIENTOS <span class="fw-fk__n" id="fk-count"></span></button>
    <button class="fw-fk__b" data-view="presupuestos"><span class="fw-key">F3</span>PRESUPUESTOS</button>
    <button class="fw-fk__b" data-view="metas"><span class="fw-key">F4</span>METAS</button>
    <button class="fw-fk__b" data-view="calculadora"><span class="fw-key">F5</span>CALCULADORA</button>
    <button class="fw-fk__b" data-view="ajustes"><span class="fw-key">F6</span>AJUSTES</button>
    <span class="fw-fk__sp"></span>
    <span class="fw-fk__st">
      <span id="st-mes" data-tip="Mes anterior y siguiente (flechas del teclado)" data-tip-side="top">
        <span class="fw-key"><i data-icon="chevronLeft"></i></span><span class="fw-key"><i data-icon="chevronRight"></i></span>MES
      </span>
      <span id="st-saldo" data-tip="Balance del mes en pantalla" data-tip-side="top"></span>
      <span id="st-saved" data-tip="Último guardado" data-tip-side="top"><span class="fw-dot-ok" id="st-dot"></span><span id="st-saved-v">GUARDADO</span></span>
    </span>
  </nav>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="ox-layer"></div>

<!-- El vidrio del tubo: encima de todo, también de los overlays. -->
<div class="fw-crt" aria-hidden="true"></div>

<script type="module" src="./js/app.js"></script>
