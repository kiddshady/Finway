<!-- ═══════════════════════════════════════════════════════════════════════════
     FINWAY — el ícono para tamaños chicos (≤ 24 px)
     El mismo desvío, con el glifo agrandado ~30% y el trazo a 25.

     Por qué existe una segunda versión: la baldosa va al 100% del lienzo —es la
     regla, y es la que hace que el ícono no se vea más chico que el de al lado
     en la barra de tareas—, pero a 16 px eso deja el glifo en unos 10 píxeles y
     el tronco en poco más de uno. Agrandando el dibujo dentro de la MISMA
     baldosa, el mismo ícono pasa a tener 13 y el trazo llega a dos píxeles
     enteros, que es la diferencia entre leerse y ser una mancha.

     Geometría escalada 1,3× desde el centro (128,128). Si se toca el master
     grande, hay que rehacer esta cuenta o los dos íconos dejan de ser el mismo.
     ═══════════════════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="48" fill="#101216"/>
  <g fill="none" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 128h62" stroke="#e9ebee"/>
    <path d="M94 128 167 55h57" stroke="#1e914e"/>
    <path d="M94 128 167 201h57" stroke="#df2326"/>
  </g>
</svg>
