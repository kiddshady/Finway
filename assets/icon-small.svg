<!-- ═══════════════════════════════════════════════════════════════════════════
     FINWAY — el ícono para tamaños chicos (≤ 24 px)
     La misma F, agrandada ~30% dentro de la misma baldosa: a 16 px el master
     grande deja los brazos en poco más de un píxel y se empastan.
     ═══════════════════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ebee"/>
      <stop offset="1" stop-color="#6e737b"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#101216"/>
  <g transform="translate(-23.92 -25.50) scale(6.33)">
    <rect x="9" y="9" width="5.5" height="30.5" rx="2.75" fill="url(#g)"/>
    <rect x="17.3" y="9" width="21.7" height="5.5" rx="2.75" fill="#e9ebee"/>
    <rect x="17.3" y="17.3" width="14" height="5.5" rx="2.75" fill="#a4a9b0"/>
    <rect x="17.3" y="25.6" width="18" height="5.5" rx="2.75" fill="#6e737b"/>
  </g>
</svg>
